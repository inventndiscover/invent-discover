<title>Page not found · Invent + Discover</title>
<meta name="robots" content="noindex">
<script>
/* The blog moved from inventndiscover.com to blog.inventndiscover.com.
   Old WordPress addresses (dated posts, pages, categories, tags, uploads)
   are sent to the same address on the blog, so old links and Google results keep working. */
(function () {
  var p = location.pathname, q = location.search, h = location.hash;
  var old = /^\/(\d{4}\/\d{2}\/|page\/\d+|category\/|tag\/|author\/|wp-content\/|wp-admin|feed\/?$|comments\/|\?p=)/;
  if (old.test(p.replace(/^\/+/, "/")) || /(^|&)p=\d+/.test(q.slice(1))) {
    location.replace("https://blog.inventndiscover.com" + p + q + h);
  }
})();
</script>
