<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tufani Samundar · Invent + Discover</title>
<link rel="canonical" href="https://inventndiscover.com/demos/tufani-samundar/">
<meta property="og:title" content="Tufani Samundar: a real-time storm ocean you can dive into">
<meta property="og:image" content="https://inventndiscover.com/media/tufani-samundar-storm.jpg">
<meta name="description" content="A real-time dive under a force-10 storm: whale, sharks, rays, turtles, octopus, reef life, a dive torch, live sound and WebXR VR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL canvas; one compact instrument card pinned bottom-left. Single dark, monochrome look by design. */
:root{
  --ink:#eef0ee; --dim:rgba(238,240,238,.58); --faint:rgba(238,240,238,.2); --hair:rgba(238,240,238,.13);
  --glass:rgba(10,12,13,.46); --ground:#050607;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ground);overflow:hidden;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c:active{cursor:grabbing}
#ui{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(262px,calc(100vw - 28px));box-sizing:border-box;padding:10px 12px 9px;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(.6);backdrop-filter:blur(14px) saturate(.6);
  border:1px solid var(--hair);border-radius:6px;font:400 10.5px/1.35 var(--mono);letter-spacing:.02em;
  display:grid;gap:7px;user-select:none;transition:opacity .3s}
#ui.hidden{opacity:0;pointer-events:none}
.head{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:10px}
#fps{color:var(--dim);font-variant-numeric:tabular-nums}
.ctl{display:grid;grid-template-columns:44px 1fr 58px;align-items:center;gap:8px}
.k{color:var(--dim);text-transform:uppercase;letter-spacing:.14em;font-size:9.5px}
.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--dim);margin:-4px 0 1px 52px;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--faint)}
input[type=range]::-moz-range-track{height:1px;background:var(--faint)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:var(--ink);margin-top:-4px;border:0}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--ink);border:0}
input[type=range]:focus-visible{outline:1px solid var(--dim);outline-offset:2px}
.btns{display:flex;gap:5px;flex-wrap:wrap}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
button{font:inherit;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:transparent;
  border:1px solid var(--hair);border-radius:3px;padding:4px 7px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--faint)}
button[aria-pressed=true]{color:var(--ground);background:var(--ink);border-color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
button.dim{opacity:.55}
button:focus-visible{outline:1px solid var(--ink);outline-offset:1px}
#bView{margin-left:auto}
.hint{color:var(--dim);font-size:9px;line-height:1.5;border-top:1px solid var(--hair);padding-top:6px;display:grid}
#msg{color:var(--ink);font-size:9.5px;line-height:1.45;border-left:1px solid var(--faint);padding-left:7px}
.hr{display:flex;gap:8px;align-items:center}
button.x{border:0;padding:0 2px;font-size:13px;line-height:1;letter-spacing:0}
#show{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;background:var(--glass)}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));font:400 10px var(--mono);
  letter-spacing:.24em;text-transform:uppercase;color:var(--dim);pointer-events:none;transition:opacity .8s;white-space:nowrap}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;font:400 13px/1.6 var(--mono);color:var(--ink);text-align:center}
[hidden]{display:none!important}
@media (max-width:560px){#cap{display:none}}
@media (prefers-reduced-motion:reduce){#ui{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Real-time storm dive view"></canvas>
<div id="ui" role="group" aria-label="Reef controls">
  <div class="head"><span class="brand">Tufani Samundar</span><span class="hr"><span id="fps">— fps</span><button id="bHide" class="x" aria-label="Hide controls (H)">×</button></span></div>
  <div class="btns">
    <div class="seg" role="group" aria-label="Mode">
      <button id="mTour" aria-pressed="true">Tour</button><button id="mSwim" aria-pressed="false">Swim</button><button id="mFly" aria-pressed="false">Fly</button>
    </div>
    <button id="bView" title="Switch view (V)">3rd person</button>
  </div>
  <label class="ctl" for="sea"><span class="k">Sea</span><input id="sea" type="range" min="0" max="10" step="0.1" value="9.6"><span class="v" id="seaV">Bft 9.6</span></label>
  <div class="sub" id="seaD">Storm</div>
  <label class="ctl" for="tod"><span class="k">Time</span><input id="tod" type="range" min="0" max="24" step="0.05" value="14.4"><span class="v" id="todV">14:24</span></label>
  <label class="ctl" for="cld"><span class="k">Cloud</span><input id="cld" type="range" min="0" max="1" step="0.01" value="0.95"><span class="v" id="cldV">95%</span></label>
  <label class="ctl" for="rain"><span class="k">Rain</span><input id="rain" type="range" min="0" max="1" step="0.01" value="0.7"><span class="v" id="rainV">steady</span></label>
  <div class="btns">
    <button id="bBolt" aria-pressed="true">Lightning</button>
    <button id="bTorch" aria-pressed="true">Torch</button>
    <button id="bSound" aria-pressed="true">Sound</button>
    <button id="bVR" aria-pressed="false">Enter VR</button>
  </div>
  <div id="msg" role="status" hidden></div>
  <div class="hint" id="hint"><span>Any key or drag takes over</span><span>T replays the tour · H hides this</span></div>
</div>
<button id="show">Controls</button>
<div id="cap"></div>
<div id="err"></div>
<script>
'use strict';
(() => {
const TEST = /[?&]test/.test(location.search);
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false, stencil:false, preserveDrawingBuffer:TEST, powerPreference:'high-performance'});
function fail(msg){ const e=document.getElementById('err'); e.style.display='grid'; e.textContent=msg; document.getElementById('ui').style.display='none'; throw new Error(msg); }
if(!gl) fail('This ocean needs WebGL 2, which this browser or device does not provide.');
if(!gl.getExtension('EXT_color_buffer_float')) fail('This ocean needs floating-point render targets (EXT_color_buffer_float), which this GPU does not provide.');
gl.getExtension('OES_texture_float_linear');
const ANISO = gl.getExtension('EXT_texture_filter_anisotropic');

// ---------------------------------------------------------------- GL helpers
function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    console.error(log + '\n' + src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
    throw new Error('Shader compile failed: '+log);
  }
  return s;
}
const HDR = `#version 300 es
precision highp float; precision highp int; precision highp sampler2DArray; precision highp sampler3D; precision highp sampler2DShadow;
#define PI 3.14159265359
`;
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, HDR+vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, HDR+fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link failed: '+gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const info = gl.getActiveUniform(p,i); const name = info.name.replace(/\[0\]$/,''); u[name] = gl.getUniformLocation(p, info.name); }
  let unit = 0; const samplers = {};
  return {p, u, use(){ gl.useProgram(p); unit = 0; return this; },
    tex(name, t, target=gl.TEXTURE_2D){ if(u[name]===undefined) return this; gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(target, t); gl.uniform1i(u[name], unit); unit++; return this; },
    f(name, ...v){ const l=u[name]; if(l===undefined) return this; if(v.length===1 && v[0].length){ const a=v[0]; ({1:gl.uniform1fv,2:gl.uniform2fv,3:gl.uniform3fv,4:gl.uniform4fv})[a.length<=4?a.length:1].call(gl,l,a); } else ({1:gl.uniform1f,2:gl.uniform2f,3:gl.uniform3f,4:gl.uniform4f})[v.length].call(gl,l,...v); return this; },
    fv(name, kind, arr){ const l=u[name]; if(l===undefined) return this; gl['uniform'+kind+'fv'](l, arr); return this; },
    i(name, v){ const l=u[name]; if(l!==undefined) gl.uniform1i(l, v); return this; },
    m(name, m){ const l=u[name]; if(l!==undefined) gl.uniformMatrix4fv(l, false, m); return this; }};
}
function texture(w, h, internal, format, type, o={}){
  const t = gl.createTexture(); const target = o.layers ? gl.TEXTURE_2D_ARRAY : (o.depth3 ? gl.TEXTURE_3D : gl.TEXTURE_2D);
  gl.bindTexture(target, t);
  const levels = o.mips ? Math.floor(Math.log2(Math.max(w,h)))+1 : 1;
  if(o.layers) gl.texStorage3D(target, levels, internal, w, h, o.layers);
  else if(o.depth3) gl.texStorage3D(target, levels, internal, w, h, o.depth3);
  else gl.texStorage2D(target, levels, internal, w, h);
  if(o.data) gl.texSubImage2D(target, 0, 0, 0, w, h, format, type, o.data);
  const minF = o.mips ? gl.LINEAR_MIPMAP_LINEAR : (o.filter||gl.LINEAR);
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, minF);
  gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, o.filter||gl.LINEAR);
  const wrap = o.wrap||gl.CLAMP_TO_EDGE;
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, o.wrapS||wrap); gl.texParameteri(target, gl.TEXTURE_WRAP_T, wrap);
  if(o.depth3) gl.texParameteri(target, gl.TEXTURE_WRAP_R, wrap);
  if(o.aniso && ANISO) gl.texParameterf(target, ANISO.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(ANISO.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  t.w=w; t.h=h; t.target=target;
  return t;
}
function framebuffer(colors, depth){
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  const bufs = [];
  colors.forEach((c,i)=>{
    if(c.rb) gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0+i, gl.RENDERBUFFER, c.rb);
    else if(c.layer!==undefined) gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0+i, c.tex, c.level||0, c.layer);
    else gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0+i, gl.TEXTURE_2D, c.tex||c, c.level||0);
    bufs.push(gl.COLOR_ATTACHMENT0+i);
  });
  if(depth){ if(depth.rb) gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth.rb); else gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depth, 0); }
  gl.drawBuffers(bufs.length ? bufs : [gl.NONE]);
  if(!bufs.length) gl.readBuffer(gl.NONE);
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete: 0x'+st.toString(16));
  return f;
}
const emptyVAO = gl.createVertexArray();
function fullscreen(){ gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); }
function target(f, w, h){ gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.viewport(0,0,w,h); }

// ---------------------------------------------------------------- math
const V = {
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]), norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]
};
const M = {
  persp(fovy, asp, n, f){ const t=1/Math.tan(fovy/2); return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]); },
  ortho(l,r,b,t,n,f){ return new Float32Array([2/(r-l),0,0,0, 0,2/(t-b),0,0, 0,0,-2/(f-n),0, -(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1]); },
  lookDir(fwd, up, eye){ const z=V.norm(V.mul(fwd,-1)); const x=V.norm(V.cross(up,z)); const y=V.cross(z,x);
    return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -V.dot(x,eye),-V.dot(y,eye),-V.dot(z,eye),1]); },
  mul(a,b){ const o=new Float32Array(16); for(let c=0;c<4;c++) for(let r=0;r<4;r++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; } return o; },
  inv(m){ const a=m, o=new Float32Array(16);
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; d=1/d;
    o[0]=(a11*b11-a12*b10+a13*b09)*d;o[1]=(a02*b10-a01*b11-a03*b09)*d;o[2]=(a31*b05-a32*b04+a33*b03)*d;o[3]=(a22*b04-a21*b05-a23*b03)*d;
    o[4]=(a12*b08-a10*b11-a13*b07)*d;o[5]=(a00*b11-a02*b08+a03*b07)*d;o[6]=(a32*b02-a30*b05-a33*b01)*d;o[7]=(a20*b05-a22*b02+a23*b01)*d;
    o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
    o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d; return o; }
};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), mix=(a,b,t)=>a+(b-a)*t, smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------------------------------------------------------------- shared GLSL
const FSQ_VS = `out vec2 vUv; void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); vUv=p; gl_Position=vec4(p*2.-1.,0.,1.); }`;
const G_HASH = `
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
vec3 hash33(vec3 p3){ p3=fract(p3*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float hash13(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float remap(float v,float a,float b,float c,float d){ return c+(v-a)/(b-a)*(d-c); }
`;
const G_ATMOS = `
const float Rg=6360e3, Rt=6420e3;
const vec3 betaR=vec3(5.802e-6,13.558e-6,33.1e-6);
const float betaMs=3.996e-6, betaMe=4.44e-6;
const vec3 betaO=vec3(0.650e-6,1.881e-6,0.085e-6);
vec3 atmDens(float h){ return vec3(exp(-h/8000.), exp(-h/1200.), max(0.,1.-abs(h-25000.)/15000.)); }
vec3 transToTop(vec3 p, vec3 L){
  float b=dot(p,L), r2=dot(p,p);
  float dg=b*b-(r2-Rg*Rg);
  float shadow=1.;
  if(dg>0. && -b-sqrt(dg)>0.) shadow=0.;
  float tt=-b+sqrt(max(b*b-(r2-Rt*Rt),0.));
  vec3 od=vec3(0.); float dt=tt/6.;
  for(int i=0;i<6;i++){ vec3 q=p+L*(dt*(float(i)+.5)); od+=atmDens(length(q)-Rg)*dt; }
  return shadow*exp(-(betaR*od.x+betaMe*od.y+betaO*od.z));
}
float phaseR(float mu){ return 3./(16.*PI)*(1.+mu*mu); }
float phaseM(float mu,float g){ float g2=g*g; return 3./(8.*PI)*((1.-g2)*(1.+mu*mu))/((2.+g2)*pow(max(1.+g2-2.*g*mu,1e-4),1.5)); }
float hg(float mu,float g){ float g2=g*g; return (1.-g2)/(4.*PI*pow(max(1.+g2-2.*g*mu,1e-4),1.5)); }
vec2 skyUV(vec3 d){ float az=atan(d.x,d.z); float el=asin(clamp(d.y,-1.,1.)); float v=sign(el)*sqrt(abs(el)/(PI*.5)); return vec2(az/(2.*PI)+.5, v*.5+.5); }
vec3 skyDir(vec2 uv){ float az=(uv.x-.5)*2.*PI; float s=uv.y*2.-1.; float el=sign(s)*s*s*PI*.5; return vec3(cos(el)*sin(az), sin(el), cos(el)*cos(az)); }
`;
// lighting/weather uniforms shared by scene shaders
const G_SCENE = `
uniform vec3 uCam; uniform vec3 uKeyDir; uniform vec3 uKeyCol; uniform vec3 uSunDir; uniform float uTime;
uniform sampler2D uSkyLUT; uniform sampler2D uEnv;
uniform float uHaze; uniform float uFogExt; uniform vec3 uFogCol; uniform vec4 uFlash; uniform float uRain; uniform float uOvercast;
vec3 envLookup(vec3 d, float lod){ d.y=max(d.y,0.004); return textureLod(uEnv, skyUV(normalize(d)), lod).rgb; }
vec3 skyIrr(vec3 n){ return textureLod(uEnv, skyUV(normalize(vec3(n.x, max(n.y,0.05)+0.35, n.z))), 7.).rgb*PI; }
vec3 aerial(vec3 col, vec3 dir, float dist){
  vec3 hz = textureLod(uSkyLUT, skyUV(normalize(vec3(dir.x, max(dir.y,0.)*.3+0.012, dir.z))), 0.).rgb*(1.-.72*uOvercast);
  vec3 ext = betaR + betaMe*uHaze;
  vec3 T = exp(-ext*dist);
  col = col*T + hz*(1.-T);
  float tf = 1.-exp(-uFogExt*dist);
  return mix(col, uFogCol, tf);
}
`;
const G_CLOUD = `
uniform sampler3D uNoise; uniform float uCov, uCovThr, uCBase, uCTop, uCDens; uniform vec2 uWindOff;
// field ~ unit-variance mix of a 60 km weather pattern and 2-3 km cumulus cells; threshold set on the CPU so
// 'coverage' is the fraction of sky covered. Tall where the field is strong, flat bases, rounded tops.
float cloudField(vec3 pw, float lod){
  float wm=textureLod(uNoise, vec3(pw.xz*1.6e-5, .31), lod).r;
  vec4 n=textureLod(uNoise, pw*vec3(1.1e-4,1.4e-4,1.1e-4)+vec3(0.,.2,0.), lod);
  float wf=n.g*.625+n.b*.25+n.a*.125;
  return .6*(wm-.73)/.13 + .4*((n.r-.73)/.13*.55+(wf-.47)/.12*.45);

// Every animal is generated here from a few numbers: bodies are lofted from cross-section profiles, fins are flat
// polygons, arms and tentacles are rebuilt in the vertex shader from a curvature function. One shader animates and

// ---- mesh builder with a 4-component tag per vertex: (s along body 0 nose..1 tail, part, a, b)
// part: 0 body, 1 fin (thin, translucent, two-sided), 2 eye, 3 arm/tentacle (procedural), 4 limb (leg/flipper), 5 glow, 6 jaw, 7 shell

function updateBoat(dt, t){

  if(probeValid){

    const hc=g(1), hb=g(2), hs=g(3), hp=g(4), hsb=g(5);
    boat.tHeave=(hc*2+hb+hs+hp+hsb)/6; boat.tPitch=Math.atan2(hb-hs,10); boat.tRoll=Math.atan2(hp-hsb,3.8);
  }

  while(boatAcc>=hstep){ boatAcc-=hstep;
    const spring=(x,v,T,w,z)=>{ const a=w*w*(T-x)-2*z*w*v; v+=a*hstep; return [x+v*hstep, v]; };

  // sails down at anchor: only the furled main on the boom and a furled headsail
  if(sailKey!=='furled'){ sailKey='furled';

  const out=[]; const [pm,pn]=basisMat(X,Y,Z,[.05,.017,.042],L(.0,.0,0)); out.push([unitMesh.sph,pm,pn]);

  mode(m){ setMode(m); }, view(v){ if(cam.view!==v) toggleView(); },

  lookAt(p,t,fov){ setMode('fly'); cam.pos=p.slice(); cam.under=p[1]<0; const a=lookAtAngles(p,t); cam.yaw=a.yaw; cam.pitch=a.pitch; if(fov) cam.fov=fov*Math.PI/180; },
  swimAt(p,yaw,pitch){ setMode('swim'); diver.pos=p.slice(); diver.vel=[0,0,0]; cam.yaw=yaw; cam.pitch=pitch; diver.F=V.norm(fwdOf(yaw,0)); camSm.p=null; },
  tour(t){ setMode('tour'); cam.tourT=t; },
  showDiver(b){ forceDiver=b; },
  testLabel(){ vrLabel('Fly','Left stick flies where you look'); vrLab.pos=V.add(cam.pos,V.mul(fwdOf(cam.yaw,cam.pitch),1.5)); forceLabel=true; },
  keys, strike(){ S.bolt=true; bolt.next=0; },
  fishSample(n){ gl.bindFramebuffer(gl.FRAMEBUFFER, fishF[fishCur]); gl.readBuffer(gl.COLOR_ATTACHMENT0); const a=new Float32Array(FISH_N*4); gl.readPixels(0,0,FW,FW,gl.RGBA,gl.FLOAT,a);
    const out=[]; for(let i=0;i<FISH_N;i+=Math.floor(FISH_N/n)) out.push([a[i*4],a[i*4+1],a[i*4+2]].map(x=>+x.toFixed(2))); return out; },
  get simT(){ return simT; }, get waterAtCam(){ return waterAtCam; }, get bubbles(){ return bub.n; }
};
window.initMs=Math.round(performance.now());
if(!TEST) requestAnimationFrame(loop);
else window.reefReady=true;


})();
